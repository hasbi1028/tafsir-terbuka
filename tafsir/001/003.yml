    status: "tetap"
bantahan:
  - isi: "Pengulangan dianggap mubazir; sebagian pembaca menyebutnya dua nama yang berbeda."
    jawaban: "Teks diterima apa adanya; pengulangan dicatat sebagai ciri gaya, tidak disimpulkan menjadi tuntutan baru."
status: "ditinjau-1"
