bukti_internal:
  - ayat: "QS 7:156"
    alasan: "Rahmat Allah dinyatakan meliputi segala sesuatu — menopang penggunaan akar yang sama."
klaim:
  - isi: "Rahmat disebut dua kali dengan dua pola berbeda sebagai penegasan, bukan dua tuhan."
